<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container" style="max-width: 600px;">
            <h5>
                <a href="#" class="navbar-band">Todo
                    <span class="badge bg-danger ms-2">0</span>
                </a>
            </h5>
            <!-- <ul class="navbar">
                <li class="navbar-item">
                    <a href="#" id="clear">Clear</a>
                </li>
            </ul> -->
            <button id="clear" class="btn btn-warning">Clear</button>
        </div>
    </nav>
    <div class="container" style="max-width: 600px;">
        <div class="input-group my-4">
            <input type="text" class="form-control">
            <button class="btn btn-dark" id="add">Add</button>
        </div>

        <ul id="todo" class="list-group"></ul>
        <ul id="done" class="list-group mt-4 opacity-50"></ul>
    </div>
    <!-- <h1>Todo list</h1>
    <div>
        <input type="text"><button>Add</button>
    </div>
    <ul id="todo"></ul> -->

    <script>
        document.querySelector("#clear").onclick = () => {
            console.log("click");
            document.querySelector("#done").textContent = "";
        }

        // function click () {
        //     console.log("click");
        // }

        function updateCount(){
            document.querySelector(".badge").textContent =
                document.querySelectorAll("#todo li").length;
        }

        document.querySelector("#add").onclick = () => {
            let text = document.querySelector("input").value;
            if(text =="") return false;
            createItem(text);
            updateCount();

            document.querySelector("input").value = "";
            document.querySelector("input").focus();
        }

        document.querySelector("input").onkeydown = e => {
            if(e.key == "Enter") {
                document.querySelector("#add").onclick();
            }
        }

        function createItem(text) {
            let li = document.createElement("li");
            li.classList.add("list-group-item");
            li.textContent = text;

            let del = document.createElement("a");
            del.classList.add("fa-solid", "fa-trash", "float-end", "text-danger");
            del.setAttribute("href", "#");
            // del.textContent = "Delete";
            del.onclick = () => {
                li.remove();
                updateCount();
            }
            li.appendChild(del);

            let check = document.createElement("a");
            check.setAttribute("href", "#");
            check.classList.add("fa-solid", "fa-check", "float-start", "me-2");
            check.onclick = () => {
                document.querySelector("#done").appendChild(li);
                check.remove();
                updateCount();
            }
            li.appendChild(check);

            document.querySelector("#todo").appendChild(li);
        }
    </script>
</body>
</html>
